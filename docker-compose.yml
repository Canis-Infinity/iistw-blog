version: "3.3"

services:
  blog:
    image: node:20-alpine
    container_name: iistw-blog
    working_dir: /app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 6006
    volumes:
      - ./:/app
      - blog_node_modules:/app/node_modules
      - blog_next:/app/.next
    network_mode: "host"
    command: sh -c "npm ci --include=dev && npm run build && npm prune --omit=dev && npm start"
    restart: unless-stopped

volumes:
  blog_node_modules:
  blog_next:
