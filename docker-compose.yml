services:
  blog:
    image: node:24-alpine
    container_name: iistw-blog
    working_dir: /app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 6006
    volumes:
      - ./:/app
      - blog_node_modules:/app/node_modules
      - blog_next:/app/.next
    ports:
      - "6006:6006"
    command: sh -c "if [ -f package-lock.json ]; then npm ci --include=dev; else npm install --include=dev; fi && npm run build && npm prune --omit=dev && npm start"
    restart: unless-stopped

volumes:
  blog_node_modules:
  blog_next:
